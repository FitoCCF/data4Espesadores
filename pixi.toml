[workspace]
authors = ["Adolfo CCF <accallof@unsa.edu.pe>"]
channels = ["conda-forge"]
name = "data4Espesadores"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
lab = "jupyter lab --ServerApp.password='argon2:$argon2id$v=19$m=10240,t=10,p=8$Cg7Y3clG7fGwMISFbRhTow$UoOSbLk00fS6NzzPgOlP0BljZOJxiFjJmBEbMiYrowQ'"
# Punto de entrada único de punta a punta (criterio de aceptación 3 de la
# migración): PYTHONPATH=src expone el paquete `espesadores`.
pipeline = "PYTHONPATH=src python -m espesadores.pipeline.orquestador"
piscinas = "PYTHONPATH=src python -m espesadores.dominio.piscinas"
guardias = "PYTHONPATH=src python -m espesadores.dominio.guardias"
diagnostico = "PYTHONPATH=src python -m espesadores.calidad.diagnostico_extraccion"
test = "PYTHONPATH=src python -m pytest tests/ -v"

[dependencies]
python = ">=3.3.14,<3.15"
jupyterlab = ">=4.5.8,<5"
pandas = ">=3.0.3,<4"
numpy = ">=2.4.6,<3"
matplotlib = ">=3.11.0,<4"
seaborn = ">=0.13.2,<0.14"
scikit-learn = ">=1.9.0,<2"
tensorflow = ">=2.19.1,<3"
hdbscan = ">=0.8.44,<0.9"
# Agregados en la migración de 2026-09-06 (hallazgo de reproducibilidad,
# docs/inventario_proyecto.md §10): pyarrow faltaba por completo — ni
# `pd.read_parquet` funcionaba en este entorno — y statsmodels estaba
# instalado en el entorno pero no declarado aquí (instalado por fuera del
# lockfile). hmmlearn/ruptures son de la línea de regímenes de mineral
# (notebooks/regimenes_mineral/), no de la producción, pero se listan para
# quien la retome. pyyaml es requisito de espesadores.config.
pyarrow = ">=18,<19"
statsmodels = ">=0.14,<0.15"
pyyaml = ">=6,<7"
pytest = ">=8,<9"
pytz = ">=2024.1"
hmmlearn = ">=0.3,<0.4"
ruptures = ">=1.1,<2"
# pythonnet + el AF SDK de OSIsoft (src/espesadores/extraccion/) NO se agregan
# aquí: el SDK son DLLs de Windows, no instalables en este entorno Linux/WSL
# aunque pythonnet resuelva. Esa etapa solo corre en la máquina Windows
# original (ver docs/inventario_proyecto.md §10).
