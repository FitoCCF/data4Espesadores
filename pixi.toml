[workspace]
authors = ["Adolfo CCF <accallof@unsa.edu.pe>"]
channels = ["conda-forge"]
name = "data4Espesadores"
# win-64 agregado 2026-09-06: la extracción PI (src/espesadores/extraccion/)
# solo corre en la máquina Windows con el AF SDK de OSIsoft (pythonnet, DLLs
# .NET). tensorflow/hdbscan/etc. no tienen build win-64 en conda-forge, así
# que el stack de análisis completo queda restringido a la feature `analisis`
# (linux-64) y win-64 solo resuelve la feature liviana `extraccion` —
# ver [environments] más abajo.
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
lab = "jupyter lab --ServerApp.password='argon2:$argon2id$v=19$m=10240,t=10,p=8$Cg7Y3clG7fGwMISFbRhTow$UoOSbLk00fS6NzzPgOlP0BljZOJxiFjJmBEbMiYrowQ'"
# Punto de entrada único de punta a punta (criterio de aceptación 3 de la
# migración): PYTHONPATH=src expone el paquete `espesadores`.
pipeline = "PYTHONPATH=src python -m espesadores.pipeline.orquestador"
piscinas = "PYTHONPATH=src python -m espesadores.dominio.piscinas"
guardias = "PYTHONPATH=src python -m espesadores.dominio.guardias"
diagnostico = "PYTHONPATH=src python -m espesadores.calidad.diagnostico_extraccion"
test = "PYTHONPATH=src python -m pytest tests/ -v"
# Solo disponible en la máquina Windows (entorno `extraccion`, ver abajo):
#   pixi run -e extraccion extraer
extraer = "PYTHONPATH=src python scripts/extraer.py"

# Dependencias base: livianas, resuelven en linux-64 y win-64 por igual.
# Son las que necesita tanto el análisis (feature `analisis`) como la
# extracción PI (feature `extraccion`) — evita duplicarlas en ambas.
[dependencies]
python = ">=3.3.14,<3.15"
pandas = ">=3.0.3,<4"
numpy = ">=2.4.6,<3"
pyarrow = ">=18,<19"
pyyaml = ">=6,<7"
pytest = ">=8,<9"
pytz = ">=2024.1"

# ------------------------------------------------------------------------- #
# Feature `analisis`: el stack completo de EDA/modelado. Restringida a
# linux-64 porque tensorflow>=2.19 y hdbscan no tienen build win-64 en
# conda-forge (falló `pixi lock` al agregar win-64 sin este split).
# ------------------------------------------------------------------------- #
[feature.analisis]
platforms = ["linux-64"]

[feature.analisis.dependencies]
jupyterlab = ">=4.5.8,<5"
matplotlib = ">=3.11.0,<4"
seaborn = ">=0.13.2,<0.14"
scikit-learn = ">=1.9.0,<2"
tensorflow = ">=2.19.1,<3"
hdbscan = ">=0.8.44,<0.9"
# Agregados en la migración de 2026-09-06 (hallazgo de reproducibilidad,
# docs/inventario_proyecto.md §10): statsmodels estaba instalado en el
# entorno pero no declarado aquí (instalado por fuera del lockfile).
# hmmlearn/ruptures son de la línea de regímenes de mineral
# (notebooks/regimenes_mineral/), no de la producción, pero se listan para
# quien la retome.
statsmodels = ">=0.14,<0.15"
hmmlearn = ">=0.3,<0.4"
ruptures = ">=1.1,<2"

# ------------------------------------------------------------------------- #
# Feature `extraccion`: solo lo que pide scripts/extraer.py. Vive en la
# máquina Windows con el AF SDK de OSIsoft instalado (pythonnet + las DLLs
# .NET, que clr.AddReference carga desde conf/local/extraccion.local.yaml).
# ------------------------------------------------------------------------- #
[feature.extraccion]
platforms = ["win-64"]

[feature.extraccion.dependencies]
pythonnet = ">=3,<4"

[environments]
# Entorno de análisis (Linux/WSL): `pixi install` / `pixi run pipeline ...`.
# Incluye la feature implícita `default` (arriba: python/pandas/pyarrow/...)
# + `analisis` (jupyter, sklearn, tensorflow, ...).
default = { features = ["analisis"] }
# Entorno de extracción (Windows): `pixi run -e extraccion extraer`.
# También incluye la feature implícita `default` (pandas/numpy/pyarrow/pyyaml/
# pytz, que scripts/extraer.py necesita) + `extraccion` (pythonnet). NO poner
# no-default-feature aquí: sin la feature `default` faltarían esas libs.
extraccion = { features = ["extraccion"] }
