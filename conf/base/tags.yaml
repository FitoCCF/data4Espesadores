# ==============================================================================
# TAGS PI — ESPESADORES DE RELAVES C2 (TH-001 / TH-002 / TH-003)
# ==============================================================================
# Única fuente de tags del proyecto. Ningún módulo de src/ debe tener un tag
# escrito literalmente en el código: todo se lee de aquí (requisito de la
# sección 6 del traspaso PROMPT_CLAUDE_CODE.md y criterio de aceptación 7/4).
#
# Para agregar un espesador nuevo: copiar el bloque de TH-001 en
# `espesadores` y reemplazar cada tag.
#
# Validación 2026-09-15 contra PI vía data4cdpv1_local/scripts/pi_tool.py
# (pasarela PiGateway, `perfil`/`buscar`): 67/68 tags de `extraccion_pi`
# existen y tienen historia (hasta 1354 días, desde 2022-12-30 — más rango
# del asumido en extraccion.yaml). Único inexistente: `C2_Sol_Overflow_Output`
# (H-E) — no hay punto PI con ese nombre exacto; los puntos reales son
# `C2_Sol_Overflow_average_Output` / `_L1_Output` / `_L2_Output`, pero solo
# tienen UN evento historizado (2026-09-10), así que H-E se sostiene en la
# práctica aunque el nombre en `globales.sol_overflow` esté mal escrito.
#
# Los campos antes marcados `completar: true` para TH-002/TH-003 eran
# suposiciones erróneas: `FV_1101` existe en PI pero es la válvula del
# Molino 1 (`_293400_FV_1101_ABB`, area 293400), no un espesador; `WT_154`,
# `DIT_154`, `WT_152`, `DIT_152`, `FV_1201`, `WT_164`, `DIT_164`, `WT_162`,
# `DIT_162` no existen en PI bajo ningún patrón buscado. Se reemplazaron por
# los tags reales ya presentes y validados en `extraccion_pi` (WT_186/
# DIT_186/WT_184/DIT_184/FV_1002 para TH-002; WT_234/DIT_234/WT_236/
# DIT_236/FV_1003 para TH-003). De paso se corrigió que `floculante`/
# `agua_dilucion` de TH-002 y TH-003 apuntaban por error a los tags
# dedicados de TH-001 (FIT_104/FIT_101) en vez de a FIT_105/FIT_102 (E2) y
# FIT_106/FIT_103 (E3), que sí existen y ya estaban en la lista maestra.
#
# Insights operativos confirmados por el usuario (2026-09-15):
#   - EL INSIGHT PRINCIPAL DEL PROYECTO ES EL NIVEL DE PISCINA (LIT_106/
#     LIT_107, ver bloque `piscinas` más abajo). Cualquier otra señal de
#     recuperación de agua (rebose directo, FIT_114) es secundaria o
#     indirecta frente a esta.
#   - FIT_114 (flujo hacia piscinas desde los tanques temporales) es un
#     INDICADOR INDIRECTO de buena recuperación de agua: cuando sube el
#     nivel de los tanques 294300TK001/TK002 (LIT_108/LIT_109), se activan
#     automáticamente más bombas y aumenta FIT_114 hacia las piscinas. Es
#     decir, FIT_114 responde a LIT_108/LIT_109, no al revés — ver notas en
#     `no_asignados` más abajo.
#   - Las válvulas de alimentación FV_1001/FV_1002/FV_1003 (`valvula_alim`
#     de cada espesador en `espesadores`, abajo) las mueve el operador
#     manualmente. Cómo las mueven, y si ese patrón cambia según el tipo de
#     mineral (proxies en `globales`: `ley_rougher`, `ratio_cu`,
#     `alim_total_molino`), es una variable de interés pendiente de
#     analizar — no confundir con el torque de rastra (H de Principio 3),
#     que es respuesta del proceso y no acción del operador.

# ------------------------------------------------------------------------------
# LISTA MAESTRA DE EXTRACCIÓN (src/espesadores/extraccion/extraer_pi.py).
# Los 68 tags PI reales: (tag_pi, columna, grupo, descripcion). Único lugar
# donde vive el nombre crudo del punto PI — antes embebido como lista de
# tuplas dentro de getDataAllTH.py. `validar_tags()` sigue abortando ante
# cualquier tag o columna duplicados (guarda de H-A, el bug de PB01/PB02).
# Los 5 de grupo `aguas_abajo` con identidad resuelta en la auditoría de
# 2026-09-06 (N-2) llevan su descriptor real; siguen sin rol de espesador
# asignado (ver `no_asignados` más abajo) hasta decisión explícita.
# ------------------------------------------------------------------------------
