# ------------------------------------------------------------------------------
# Dominio: piscinas de recuperación de agua (src/espesadores/dominio/piscinas.py)
# ------------------------------------------------------------------------------
# Antes hardcodeados como COL_A/COL_B directamente en el script (hallazgo de
# la Tarea B, 2026-09-06) — corregido al migrar. Regla de derivación
# confirmada por el usuario: si ambos son parecidos, el valor es válido tal
# cual; si difieren mucho, vale el mayor (ver conf/base/reglas_operativas.yaml
# para el umbral y los horarios de cambio de guardia).
#
# CONFIRMADO POR EL USUARIO (2026-09-15): el nivel de estas dos piscinas es
# el INSIGHT PRINCIPAL del proyecto — el indicador más directo de la
# recuperación de agua. FIT_114 (flujo hacia estas piscinas desde los
# tanques temporales) es a lo sumo un indicador indirecto/secundario.
piscinas:
  transmisor_a: LIT_106   # Piscina 1 (296300XC001)
  transmisor_b: LIT_107   # Piscina 2 (296300XC002)

# ------------------------------------------------------------------------------
# Dominio: diagnóstico de guardias (src/espesadores/dominio/guardias.py).
# Variables sobre las que se busca efecto de guardia — solo consignas y
# resultados; el torque queda fuera por ser respuesta, no acción del operador.
# ------------------------------------------------------------------------------
diagnostico_guardias:
  variables_interes:
    - FIT_104
    - FIT_101
    - TH001_PLC_BEDM
    - WT_146
    - WT_144
    - PP_007A_Speed
    - PP_001A_U_Speed
    - FLUJO_REBOSE_AGUA_TH1
    - LIT_106
    - LIT_107

